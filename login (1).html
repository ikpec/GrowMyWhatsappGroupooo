<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110e"><title>Log in — GrowMyWhatsAppGroup</title>
<style>
:root{--bg:#07110e;--line:#20392d;--text:#f2f7f3;--muted:#a2b5a9;--green:#52e08b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#102b1c 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;padding:24px}.back{color:var(--muted);font-size:14px}.shell{width:min(470px,100%);margin:28px auto}.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:22px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--green),#15884a);color:#062012;font-size:22px;font-weight:900}.green{color:var(--green)}.card{border:1px solid var(--line);background:linear-gradient(145deg,#102019,#0b1712);padding:28px;border-radius:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--green)}h1{font-size:30px;line-height:1.2;margin:8px 0}p{color:var(--muted);font-size:14px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#07110e;color:var(--text);outline:none}input:focus{border-color:var(--green)}.btn{width:100%;border:0;border-radius:11px;background:var(--green);color:#062012;font-weight:800;padding:14px;margin-top:20px;cursor:pointer}.message{font-size:13px;color:#ffb5a8;min-height:18px}.switch{text-align:center;font-size:13px}.switch a{color:var(--green)}
</style></head><body><a class="back" href="index.html">← Back to home</a><main class="shell"><a class="brand" href="index.html"><span class="mark">G</span><span>GrowMy<span class="green">WhatsAppGroup</span></span></a><section class="card"><div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><p>Log in to continue to your group growth request.</p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><p id="message" class="message" role="status"></p><button class="btn" type="submit">Log in →</button></form><p class="switch">New here? <a href="signup.html">Create an account</a></p></section></main>
<script>
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const account=JSON.parse(localStorage.getItem('gwwg_demo_account')||'null'),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,msg=document.getElementById('message');if(!account){msg.textContent='No demo account found in this browser. Please sign up first.';return}if(account.email!==email||account.password!==password){msg.textContent='Email or password is incorrect.';return}localStorage.setItem('gwwg_logged_in',email);window.location.href='dashboard.html';});
</script></body></html>
