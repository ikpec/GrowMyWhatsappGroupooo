<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#071b14"><title>Create account — GrowMyWhatsAppGroup</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth-body"><a class="back-link" href="index.html">← Back to home</a><main class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="brand-mark">G</span><span>GrowMy<span class="green">WhatsAppGroup</span></span></a><div class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p class="muted">Join the community and start your group growth request.</p>
<form id="signupForm">
<label for="signupEmail">Email address</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
<label for="signupPhone">Phone number</label><input id="signupPhone" type="tel" autocomplete="tel" placeholder="e.g. 08012345678" required>
<label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Enter password again" required>
<p id="signupMessage" class="form-message" role="status"></p><button id="signupButton" class="button primary full" type="submit"><span>Create my account</span><span>→</span></button>
</form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div><p class="tiny-note">By signing up, you agree to use this service responsibly.</p></main><script type="module" src="js/auth.js"></script></body></html>
