<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#071b14"><title>Group growth request — GrowMyWhatsAppGroup</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"></head>
<body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span>GrowMy<span class="green">WhatsAppGroup</span></span></a><a class="button secondary small" href="dashboard.html">Dashboard</a></header><main class="auth-shell grow-shell"><div class="auth-card"><span class="eyebrow">GROUP GROWTH REQUEST</span><h1>Tell us about your group</h1><p class="muted">Fill in the details below. We'll open WhatsApp with your request ready to send.</p>
<form id="growthForm"><label for="groupLink">WhatsApp group invite link</label><input id="groupLink" type="url" placeholder="https://chat.whatsapp.com/..." required><label for="groupTopic">Group topic or description</label><textarea id="groupTopic" rows="4" placeholder="What is your group about?" required></textarea><label for="targetMembers">Target number of members</label><input id="targetMembers" type="number" min="1" step="1" placeholder="e.g. 500" required><p id="growthMessage" class="form-message" role="status"></p><button class="button primary full" type="submit">Continue to WhatsApp <span>↗</span></button></form><p class="tiny-note">Submitting this form does not guarantee a particular number of new members. The administrator will discuss your request with you.</p></div></main><script type="module" src="js/grow.js"></script></body></html>
